name: Auto-Fix with Modern Web Guidance

on:
  issues:
    types: [opened, labeled]

jobs:
  agentic-fix:
    # Optional: Only run if the issue is labeled with 'modernize' or 'bug'
    if: contains(github.event.issue.labels.*.name, 'modernize')
    runs-on: ubuntu-latest
    
    # Required permissions for the agent to push code and create PRs
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout pattishin-site repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history is needed so the agent can branch off correctly

      - name: Install Antigravity CLI
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          # Ensure the installed binary is in the runner's PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Headless Authentication
        run: |
          mkdir -p ~/.gemini/antigravity-cli/
          echo '{"modelProvider": "gemini"}' > ~/.gemini/antigravity-cli/settings.json

      - name: Install Modern Web Guidance Plugin
        # Installs the official Chrome team skills package directly into Antigravity
        run: agy plugin install https://github.com/GoogleChrome/modern-web-guidance

      - name: Run Antigravity Subagent Workflow
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Configure Git so the agent can commit on behalf of the bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pipe the issue context and instruct the agent to use Modern Web Guidance
          echo -e "Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}\n\n${{ github.event.issue.body }}" | agy -p "
          You are an expert frontend developer maintaining the pattishin.io website.
          1. Review the piped issue.
          2. Use your 'modern-web-guidance' skills to formulate a fix. You MUST prioritize modern, native web platform capabilities, Core Web Vitals, and accessibility over bloated legacy JavaScript patterns.
          3. Spawn a subagent to search the codebase, implement the necessary file edits, and run any build checks.
          4. Commit the modernized code to a new branch named 'fix/issue-${{ github.event.issue.number }}'.
          5. Use the GitHub CLI (gh) to push the branch and open a Pull Request that closes issue #${{ github.event.issue.number }}.
          "
